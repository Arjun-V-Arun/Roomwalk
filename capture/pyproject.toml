[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomwalk"
version = "0.1.0"
description = "Check, reconstruct and publish phone scans of rental rooms for RoomWalk"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "qrcode>=7.4",
  "pillow>=10.1",
]

[project.optional-dependencies]
# Structure from motion. pycolmap ships CPU wheels for Windows, macOS and Linux.
sfm = ["pycolmap>=4.0"]
# Timeline chart in the capture report.
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "pycolmap>=4.0", "matplotlib>=3.7"]

[project.scripts]
roomwalk = "roomwalk.cli:main"

[tool.setuptools.packages.find]
include = ["roomwalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run structure from motion (deselect with -m 'not slow')"]
